[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "shuper-whisper"
version = "2.0.1"
description = "Hotkey-based voice dictation for Windows using faster-whisper"
requires-python = ">=3.12"
dependencies = [
    "faster-whisper>=1.2",
    "ctranslate2>=4.5",
    "sounddevice>=0.5",
    "soxr>=0.5",
    "comtypes>=1.4",
    "numpy",
    "pystray>=0.19.5",
    "Pillow>=10.0",
    "pywebview>=5.0.0",
]

[project.gui-scripts]
shuper-whisper = "shuper_whisper.app:main"

[tool.setuptools.packages.find]
include = ["shuper_whisper*"]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-mock",
    "pytest-cov",
    "pyinstaller",
]
gpu = [
    # Same versions the in-app GPU setup downloads (gpu_runtime.WHEELS); cuDNN
    # matches the cudnn64_9.dll that ctranslate2 4.8.2 bundles.
    "nvidia-cublas-cu12==12.9.2.10",
    "nvidia-cudnn-cu12==9.10.2.21",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
